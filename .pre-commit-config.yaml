repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest (sin tests lentos ni GPU)
        entry: python -m pytest -m "not slow and not gpu"
        language: system
        pass_filenames: false
        always_run: true
